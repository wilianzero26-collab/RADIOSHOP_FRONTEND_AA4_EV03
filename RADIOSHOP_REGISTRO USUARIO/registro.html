<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioShop - Crear cuenta</title>

    <link rel="stylesheet" href="registro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">
        <a href="#" class="logo">
            <span class="logo-icon">▶</span>
            <span>RADIO<span>SHOP</span></span>
        </a>

        <nav class="nav">
            <a href="#">Inicio</a>
            <a href="#">Tienda</a>
            <a href="#">Radio en vivo</a>
            <a href="#">Comunidad</a>
            <a href="#" class="ofertas">Ofertas</a>
        </nav>

        <div class="header-icons">
            <span>♡</span>
            <span>🛒</span>
            <span class="user-icon">◯</span>
        </div>
    </header>


    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">▶</div>

                <h1>Crear una cuenta</h1>

                <p>
                    Regístrate en RadioShop y disfruta de todos
                    nuestros productos y beneficios.
                </p>
            </div>

            <form class="auth-form">

                <div class="form-row">

                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="apellido">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            required
                        >
                    </div>

                </div>

                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="usuario">Nombre de usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Elige un nombre de usuario"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="password">Contraseña</label>

                        <div class="password-input">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                            >
                            <span>◉</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmar">Confirmar contraseña</label>

                        <div class="password-input">
                            <input
                                type="password"
                                id="confirmar"
                                name="confirmar"
                                placeholder="••••••••"
                                required
                            >
                            <span>◉</span>
                        </div>
                    </div>

                </div>

                <label class="checkbox">
                    <input type="checkbox" required>
                    <span>
                        Acepto los
                        <a href="#">términos y condiciones</a>
                        y la
                        <a href="#">política de privacidad</a>.
                    </span>
                </label>

                <button type="submit" class="btn-primary">
                    CREAR CUENTA
                    <span>→</span>
                </button>

            </form>

            <div class="divider">
                <span>O REGÍSTRATE CON</span>
            </div>

            <div class="social-buttons">
                <button>G</button>
                <button>f</button>
                <button></button>
            </div>

            <p class="auth-footer">
                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>

        </section>

    </main>


    <footer class="footer">
        <div class="footer-logo">
            RADIO<span>SHOP</span>
        </div>

        <p>
            © 2026 RADIOSHOP. Todos los derechos reservados.
        </p>
    </footer>

</body>
</html>
