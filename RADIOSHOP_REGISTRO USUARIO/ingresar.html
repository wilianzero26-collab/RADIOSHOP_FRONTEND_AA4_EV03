<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioShop - Iniciar sesión</title>

    <link rel="stylesheet" href="registro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">

        <a href="#" class="logo">
            <span class="logo-icon">▶</span>
            <span>RADIO<span>SHOP</span></span>
        </a>

        <nav class="nav">
            <a href="#">Inicio</a>
            <a href="#">Tienda</a>
            <a href="#">Radio en vivo</a>
            <a href="#">Comunidad</a>
            <a href="#" class="ofertas">Ofertas</a>
        </nav>

        <div class="header-icons">
            <span>♡</span>
            <span>🛒</span>
            <span class="user-icon">◯</span>
        </div>

    </header>


    <main class="auth-container">

        <section class="auth-card login-card">

            <div class="auth-header">

                <div class="auth-logo">▶</div>

                <h1>Bienvenido de nuevo</h1>

                <p>
                    Inicia sesión para continuar disfrutando
                    de RadioShop.
                </p>

            </div>


            <form class="auth-form">

                <div class="input-group">

                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <div class="label-password">
                        <label for="password">Contraseña</label>

                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="password-input">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        >

                        <span>◉</span>

                    </div>

                </div>


                <label class="checkbox">

                    <input type="checkbox">

                    <span>
                        Recordarme en este dispositivo
                    </span>

                </label>


                <button type="submit" class="btn-primary">

                    INICIAR SESIÓN

                    <span>→</span>

                </button>

            </form>


            <div class="divider">
                <span>O CONTINÚA CON</span>
            </div>


            <div class="social-buttons">

                <button>G</button>
                <button>f</button>
                <button></button>

            </div>


            <p class="auth-footer">

                ¿No tienes una cuenta?

                <a href="registro.html">
                    Crear una cuenta
                </a>

            </p>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-logo">
            RADIO<span>SHOP</span>
        </div>

        <p>
            © 2026 RADIOSHOP. Todos los derechos reservados.
        </p>

    </footer>

</body>
</html>
